name: hq-scheduler

# 백업 스케줄러. 주 스케줄러는 Worker의 Durable Object 알람(worker/src/scheduler/alarm.ts)이다(2026-11-19 전환).
# 이 워크플로도 HQ 스케줄러(동기화·판정·08:00 KST 보고서·알림)를 깨우며, 중복 실행은 HQ의 잠금과 날짜 UNIQUE가 막는다.
# 비밀 값은 쓰지 않는다. GitHub OIDC 토큰(저장소·브랜치·워크플로 파일이 서명에 포함)으로만 인증한다.
# GitHub 예약 실행은 몇 시간씩 지연될 수 있다(2026-11-16 관측: 4~5시간 간격). 그래서 한 번 깨어날 때
# 동기화 전용 호출(phase=sync, 회당 3개 프로젝트)을 SYNC_ROUNDS번 보낸 뒤 전체 tick을 보내 모든 프로젝트를 최신으로 만든다.
# HQ는 08:00~22:00 KST 사이 미발송 보고서를 따라잡아 보낸다.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  id-token: write
  contents: none

concurrency:
  group: hq-scheduler
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: HQ 스케줄러 호출
        env:
          HQ_URL: https://automatehq.dlacoaud96.workers.dev
          # 감시 프로젝트 10개 ÷ 회당 3개 → 4회 필요. 동기화 전용 3회 + 전체 tick 1회(여기서도 3개 동기화) = 최대 12개
          SYNC_ROUNDS: '3'
        run: |
          set -euo pipefail
          token=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=automatehq-scheduler" | jq -r '.value')
          echo "::add-mask::${token}"
          call() {
            local status
            status=$(curl -sS -o response.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${token}" "${HQ_URL}/api/v1/scheduler/tick$1")
            echo "HTTP ${status} $1"
            jq -c '.data // .error' response.json || true
            test "${status}" = "200"
          }
          for i in $(seq 1 "${SYNC_ROUNDS}"); do call '?phase=sync' || echo "동기화 ${i}회차 실패(계속 진행)"; done
          call ''
